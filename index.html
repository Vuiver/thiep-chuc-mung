<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎉 Thiệp Chúc Mừng 3D - Cơn Mưa Lời Chúc & Quà Cáp 🎂</title>
  <meta name="description" content="Thiệp chúc mừng 3D tương tác không gian: Lời chúc rực rỡ, gấu bông, bó hoa tươi, hộp quà, bánh kem và âm nhạc du dương.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Mali:wght@700&display=swap" rel="stylesheet">
  <!-- Three.js & Controls & Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Configuration Script -->
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #090312;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Background Photo Layer */
    .bg-photo-layer {
      position: absolute;
      inset: 0;
      background-image: url('anh-xa-bong-hoang.jpg');
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 0.85;
      filter: saturate(1.12) contrast(1.06);
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 36%, rgba(12, 4, 24, 0.26) 0%, rgba(9, 3, 18, 0.68) 72%, rgba(5, 1, 10, 0.90) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }
    .orb-1 { width: 380px; height: 380px; background: #ff416c; top: 5%; left: 5%; }
    .orb-2 { width: 340px; height: 340px; background: #ffd166; bottom: 15%; right: 10%; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: #b224ef; top: 40%; right: 30%; animation-delay: -6s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 50px) scale(1.18); }
    }

    /* Floating Tiny Audio Toggle (Góc trên cùng bên phải) */
    .audio-btn-corner {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.25s ease;
    }

    .audio-btn-corner:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.28);
    }

  </style>
</head>
<body>

  <!-- Audio Element (playsinline, autoplay, preload=auto) -->
  <audio id="bg-music" src="happy-birthday.mp3" loop autoplay playsinline preload="auto"></audio>

  <!-- Background Photo of Anh Xà Bông Hoàng -->
  <div class="bg-photo-layer" id="bg-photo"></div>
  <div class="bg-overlay"></div>

  <!-- Ambient Lights -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Tiny Audio Control -->
  <button class="audio-btn-corner" id="audio-btn" title="Bật/Tắt âm thanh">🔊</button>

  <script>
    /* =========================================================================
       1. MERGE CONFIG WITH URL PARAMETERS (HỖ TRỢ TÙY BIẾN 100%)
       ========================================================================= */
    const urlParams = new URLSearchParams(window.location.search);

    const cfg = window.CARD_CONFIG || {};
    const RECIPIENT_NAME = urlParams.get('to') || cfg.recipientName || "Người Bạn Tuyệt Vời";
    const OCCASION_TITLE = urlParams.get('title') || cfg.occasionTitle || "Chúc Mừng Sinh Nhật";
    const MUSIC_URL = urlParams.get('music') || cfg.musicUrl || "happy-birthday.mp3";

    if (RECIPIENT_NAME) {
      document.title = `🎉 ${OCCASION_TITLE} - ${RECIPIENT_NAME} 🎂`;
    }

    // Danh sách ảnh kỷ niệm (Polaroid 3D)
    let PHOTOS = cfg.photos || [];
    if (urlParams.get('img')) {
      PHOTOS = [urlParams.get('img'), ...PHOTOS];
    }

    // Danh sách lời chúc
    let WISH_LIST = (cfg.messages && cfg.messages.length > 0) ? [...cfg.messages] : [
      "🎂 HAPPY BIRTHDAY 🎂",
      "Chúc Mừng Sinh Nhật! 👑",
      "Tuổi Mới Rực Rỡ & Thăng Hoa ✨",
      "Tiền Vào Như Nước 💰",
      "Thành Công Bứt Phá 🚀",
      "Vạn Sự Như Ý 🍀",
      "Sức Khỏe Vô Biên 💪",
      "Bình An & Hạnh Phúc 🥰",
      "Trẻ Mãi Không Già 🌸",
      "Tỏa Sáng Theo Cách Riêng 🌟"
    ];
    if (urlParams.get('to')) {
      const customName = urlParams.get('to');
      WISH_LIST.unshift(`🎂 HAPPY BIRTHDAY ${customName.toUpperCase()} 🎂`, `👑 Chúc Mừng Sinh Nhật ${customName}! 👑`);
    }

    const PALETTES = [
      ["#ff416c", "#ff4b2b"], ["#f7971e", "#ffd200"], ["#ff758c", "#ff7eb3"],
      ["#b224ef", "#7579ff"], ["#11998e", "#38ef7d"], ["#00c6ff", "#0072ff"],
      ["#8a2387", "#e94057"], ["#f12711", "#f5af19"], ["#654ea3", "#eaafc8"],
      ["#4facfe", "#00f2fe"], ["#fa709a", "#fee140"], ["#0ba360", "#3cba92"],
      ["#f857a6", "#ff5858"], ["#36d1dc", "#5b86e5"], ["#e52d27", "#b31217"]
    ];

    const ALL_WISHES = WISH_LIST.map((text, idx) => ({
      id: idx + 1,
      text: text,
      bg: PALETTES[idx % PALETTES.length]
    }));

    // Cập nhật nhạc nền từ config (chỉ đổi nếu khác để không gián đoạn preload)
    const bgMusic = document.getElementById('bg-music');
    if (bgMusic.getAttribute('src') !== MUSIC_URL) {
      bgMusic.src = MUSIC_URL;
    }

    /* =========================================================================
       2. AUDIO CONTROLLER (TỰ ĐỘNG PHÁT NGAY LẬP TỨC - KHÔNG CẦN BẤM NÚT)
       ========================================================================= */
    const audioBtn = document.getElementById('audio-btn');
    let isMusicPlaying = false;
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) audioCtx = new AudioCtxClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playPopSound() {
      try {
        if (!audioCtx) initAudioContext();
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(560, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
        g.gain.setValueAtTime(0.09, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function tryPlayMusic() {
      initAudioContext();
      bgMusic.muted = false;
      bgMusic.volume = 0.95;
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isMusicPlaying = true;
          audioBtn.textContent = '🔊';
          removeGestureListeners();
        }).catch(() => {
          isMusicPlaying = false;
        });
      }
    }

    // 1. Tự động phát ngay lập tức khi vào trang qua nhiều sự kiện
    tryPlayMusic();
    window.addEventListener('DOMContentLoaded', tryPlayMusic);
    window.addEventListener('load', tryPlayMusic);
    window.addEventListener('pageshow', tryPlayMusic);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !isMusicPlaying) tryPlayMusic();
    });
    // Hỗ trợ webview (WeChat / Zalo / In-app)
    document.addEventListener('WeixinJSBridgeReady', tryPlayMusic, false);

    // 2. Kích hoạt tức thì ở cử chỉ chạm/lướt/cuộn màn hình đầu tiên (hoàn toàn âm thầm, không cần nút)
    function unlockAudioOnGesture() {
      if (!isMusicPlaying) {
        tryPlayMusic();
      }
    }
    const GESTURE_EVENTS = ['pointerdown', 'touchstart', 'touchend', 'touchmove', 'mousedown', 'click', 'scroll', 'keydown'];
    GESTURE_EVENTS.forEach((evt) => {
      window.addEventListener(evt, unlockAudioOnGesture, { passive: true, capture: true });
      document.addEventListener(evt, unlockAudioOnGesture, { passive: true, capture: true });
    });

    function removeGestureListeners() {
      GESTURE_EVENTS.forEach((evt) => {
        window.removeEventListener(evt, unlockAudioOnGesture, { capture: true });
        document.removeEventListener(evt, unlockAudioOnGesture, { capture: true });
      });
    }

    // Nút góc phải dùng bật/tắt thủ công nếu người dùng muốn dừng nhạc
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudioContext();
      if (bgMusic.paused) {
        bgMusic.play();
        isMusicPlaying = true;
        audioBtn.textContent = '🔊';
      } else {
        bgMusic.pause();
        isMusicPlaying = false;
        audioBtn.textContent = '🔇';
      }
    });

    /* =========================================================================
       3. THREE.JS SCENE, CAMERA, LIGHTS & ORBIT CONTROLS
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    let width = window.innerWidth;
    let height = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
    camera.position.set(0, 0, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 14;
    controls.maxDistance = 50;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.38;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(10, 25, 20);
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(0xff758c, 2.0, 50);
    pointLight1.position.set(-16, 12, 16);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xffd166, 2.0, 50);
    pointLight2.position.set(16, -12, 16);
    scene.add(pointLight2);

    /* =========================================================================
       4. FAIRY DUST PARTICLES
       ========================================================================= */
    const particleCount = 220;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = (Math.random() - 0.5) * 55;
      particlePos[i * 3 + 1] = (Math.random() - 0.5) * 70;
      particlePos[i * 3 + 2] = (Math.random() - 0.5) * 40;

      if (Math.random() > 0.5) {
        particleColors[i * 3] = 1.0; particleColors[i * 3 + 1] = 0.82; particleColors[i * 3 + 2] = 0.4;
      } else {
        particleColors[i * 3] = 1.0; particleColors[i * 3 + 1] = 0.46; particleColors[i * 3 + 2] = 0.6;
      }
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.65,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    /* =========================================================================
       5. 3D MODELS: GẤU BÔNG 🧸, BÓ HOA 💐, BÁNH KEM 🎂, HỘP QUÀ 🎁, TRÁI TIM ❤️, BÓNG BAY 🎈, POLAROID 📷
       ========================================================================= */
    const textureCache = new Map();

    function getPillTexture(wish) {
      if (textureCache.has(wish.text)) {
        return textureCache.get(wish.text);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      const w = 800;
      const h = 200;
      const r = 90;

      ctx.shadowColor = wish.bg[0];
      ctx.shadowBlur = 24;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      const grad = ctx.createLinearGradient(30, 20, w - 30, h - 20);
      grad.addColorStop(0, wish.bg[0]);
      grad.addColorStop(1, wish.bg[1]);

      ctx.beginPath();
      ctx.moveTo(30 + r, 20);
      ctx.lineTo(w - 30 - r, 20);
      ctx.arcTo(w - 30, 20, w - 30, h - 20, r);
      ctx.lineTo(w - 30, h - 20 - r);
      ctx.arcTo(w - 30, h - 20, 30, h - 20, r);
      ctx.lineTo(30 + r, h - 20);
      ctx.arcTo(30, h - 20, 30, 20, r);
      ctx.lineTo(30, 20 + r);
      ctx.arcTo(30, 20, w - 30, 20, r);
      ctx.closePath();

      ctx.fillStyle = grad;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.stroke();

      ctx.save();
      ctx.clip();
      const gloss = ctx.createLinearGradient(0, 20, 0, h * 0.5);
      gloss.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gloss;
      ctx.fillRect(30, 20, w - 60, h * 0.5);
      ctx.restore();

      const len = wish.text.length;
      let fontSize = 44;
      if (len > 34) fontSize = 33;
      else if (len > 24) fontSize = 38;

      ctx.font = `900 ${fontSize}px "Be Vietnam Pro", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = '#ffffff';
      ctx.fillText(wish.text, w / 2, h / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      textureCache.set(wish.text, texture);
      return texture;
    }

    const fallingItems = [];

    // 1. Thẻ Lời Chúc (Sprite)
    function createPillSprite(wish, startX, startY, startZ, speed) {
      const texture = getPillTexture(wish);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });

      const sprite = new THREE.Sprite(spriteMat);
      const isMobile = window.innerWidth < 600;
      const baseWidth = isMobile ? 8.2 : 9.6;
      const baseHeight = baseWidth / 4.0;
      sprite.scale.set(baseWidth, baseHeight, 1);
      sprite.position.set(startX, startY, startZ);
      scene.add(sprite);

      const item = { mesh: sprite, wish, baseSpeed: speed, initialY: 34, resetY: -32, type: 'pill' };
      fallingItems.push(item);
      return item;
    }

    // 2. Gấu Bông 3D 🧸
    function createTeddyBear(startX, startY, startZ, speed) {
      const group = new THREE.Group();
      const furMat = new THREE.MeshStandardMaterial({ color: 0xc68b59, roughness: 0.65 });
      const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xf3d2b5, roughness: 0.6 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), furMat);
      body.scale.set(1, 1.2, 0.9);
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 16, 16), furMat);
      head.position.set(0, 1.3, 0.1);
      group.add(head);

      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), muzzleMat);
      snout.position.set(0, 1.2, 0.7);
      snout.scale.set(1.1, 0.85, 0.9);
      group.add(snout);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), eyeMat);
      nose.position.set(0, 1.32, 0.96);
      group.add(nose);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), eyeMat);
      eyeL.position.set(-0.25, 1.45, 0.68);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), eyeMat);
      eyeR.position.set(0.25, 1.45, 0.68);
      group.add(eyeL); group.add(eyeR);

      const earL = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), furMat);
      earL.position.set(-0.55, 1.9, 0);
      const earR = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), furMat);
      earR.position.set(0.55, 1.9, 0);
      group.add(earL); group.add(earR);

      const bow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.2), ribbonMat);
      bow.position.set(0, 0.8, 0.7);
      group.add(bow);

      const armL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), furMat);
      armL.position.set(-0.95, 0.4, 0.2); armL.scale.set(0.8, 1.3, 0.8);
      const armR = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), furMat);
      armR.position.set(0.95, 0.4, 0.2); armR.scale.set(0.8, 1.3, 0.8);
      group.add(armL); group.add(armR);

      const legL = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), furMat);
      legL.position.set(-0.55, -0.85, 0.3);
      const legR = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), furMat);
      legR.position.set(0.55, -0.85, 0.3);
      group.add(legL); group.add(legR);

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.02, rotSpeedY: 0.02, rotSpeedZ: (Math.random() - 0.5) * 0.015,
        initialY: 34, resetY: -32, type: 'bear'
      };
      fallingItems.push(item);
      return item;
    }

    // 3. Bó Hoa Tươi 💐
    function createFlowerBouquet(startX, startY, startZ, speed) {
      const group = new THREE.Group();
      const wrapGeo = new THREE.ConeGeometry(1.1, 2.2, 16, 1, true);
      const wrapMat = new THREE.MeshStandardMaterial({ color: 0xf5b5c5, roughness: 0.4, side: THREE.DoubleSide });
      const wrapMesh = new THREE.Mesh(wrapGeo, wrapMat);
      wrapMesh.rotation.x = Math.PI;
      wrapMesh.position.y = -0.5;
      group.add(wrapMesh);

      const flowerColors = [0xff3366, 0xffd700, 0xff6699, 0xffffff, 0xff5722, 0xe040fb];
      for (let i = 0; i < 7; i++) {
        const fMat = new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length], roughness: 0.3 });
        const fMesh = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), fMat);
        const angle = (i / 6) * Math.PI * 2;
        const rad = i === 0 ? 0 : 0.6;
        fMesh.position.set(Math.cos(angle) * rad, 0.6 + (i === 0 ? 0.25 : 0), Math.sin(angle) * rad);
        group.add(fMesh);
      }

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.4 });
      for (let j = 0; j < 3; j++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 6), leafMat);
        const lAngle = (j / 3) * Math.PI * 2 + 0.5;
        leaf.position.set(Math.cos(lAngle) * 0.9, 0.4, Math.sin(lAngle) * 0.9);
        leaf.rotation.z = Math.cos(lAngle) * 0.5;
        group.add(leaf);
      }

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.02, rotSpeedY: 0.025, rotSpeedZ: (Math.random() - 0.5) * 0.02,
        initialY: 34, resetY: -32, type: 'bouquet'
      };
      fallingItems.push(item);
      return item;
    }

    // 4. Hộp Quà Vuông Buộc Nơ 🎁
    function createGiftMesh(startX, startY, startZ, speed) {
      const size = 1.7;
      const geometry = new THREE.BoxGeometry(size, size, size);
      const colors = [0xff416c, 0xb224ef, 0x11998e, 0xf7971e, 0xff758c, 0x00c6ff];
      const boxColor = colors[Math.floor(Math.random() * colors.length)];

      const boxMat = new THREE.MeshStandardMaterial({ color: boxColor, roughness: 0.25, metalness: 0.1 });
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.2, metalness: 0.4 });

      const mesh = new THREE.Mesh(geometry, boxMat);
      const rH = new THREE.Mesh(new THREE.BoxGeometry(size + 0.05, 0.35, size + 0.05), ribbonMat);
      const rV = new THREE.Mesh(new THREE.BoxGeometry(0.35, size + 0.05, size + 0.05), ribbonMat);
      mesh.add(rH); mesh.add(rV);

      mesh.position.set(startX, startY, startZ);
      scene.add(mesh);

      const item = {
        mesh, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.03, rotSpeedY: (Math.random() - 0.5) * 0.03, rotSpeedZ: (Math.random() - 0.5) * 0.03,
        initialY: 34, resetY: -32, type: 'gift'
      };
      fallingItems.push(item);
      return item;
    }

    // 5. Bánh Kem Sinh Nhật 🎂
    function createCakeMesh(startX, startY, startZ, speed) {
      const group = new THREE.Group();
      const bMat = new THREE.MeshStandardMaterial({ color: 0xffe3e3, roughness: 0.3 });
      const bMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.75, 24), bMat);
      bMesh.position.y = -0.38;
      group.add(bMesh);

      const tMat = new THREE.MeshStandardMaterial({ color: 0xff758c, roughness: 0.3 });
      const tMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.65, 24), tMat);
      tMesh.position.y = 0.32;
      group.add(tMesh);

      const cMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.2 });
      const cMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.55, 12), cMat);
      cMesh.position.y = 0.9;
      group.add(cMesh);

      const fMat = new THREE.MeshBasicMaterial({ color: 0xff4b2b });
      const fMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), fMat);
      fMesh.position.y = 1.25;
      group.add(fMesh);

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group, baseSpeed: speed,
        rotSpeedX: 0, rotSpeedY: 0.018, rotSpeedZ: 0,
        initialY: 34, resetY: -32, type: 'cake'
      };
      fallingItems.push(item);
      return item;
    }

    // 6. Trái Tim 3D ❤️
    function createHeartMesh(startX, startY, startZ, speed) {
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      shape.moveTo(x + 0.25, y + 0.25);
      shape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
      shape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
      shape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 1.0);
      shape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
      shape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
      shape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.35, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 });
      geo.center();

      const mat = new THREE.MeshStandardMaterial({ color: 0xff1744, roughness: 0.2, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.z = Math.PI;
      mesh.scale.set(1.4, 1.4, 1.4);
      mesh.position.set(startX, startY, startZ);
      scene.add(mesh);

      const item = {
        mesh, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.03, rotSpeedY: 0.025, rotSpeedZ: (Math.random() - 0.5) * 0.02,
        initialY: 34, resetY: -32, type: 'heart'
      };
      fallingItems.push(item);
      return item;
    }

    // 7. Bóng Bay 3D 🎈
    function createBalloonMesh(startX, startY, startZ, speed) {
      const group = new THREE.Group();
      const bColors = [0xff416c, 0xffd166, 0x00c6ff, 0xb224ef, 0x38ef7d];
      const col = bColors[Math.floor(Math.random() * bColors.length)];

      const bMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.15, metalness: 0.1 });
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.0, 18, 18), bMat);
      sphere.scale.set(1, 1.25, 1);
      group.add(sphere);

      // Knot
      const knot = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.25, 10), bMat);
      knot.position.y = -1.35;
      group.add(knot);

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.015, rotSpeedY: 0.015, rotSpeedZ: (Math.random() - 0.5) * 0.015,
        initialY: 34, resetY: -32, type: 'balloon'
      };
      fallingItems.push(item);
      return item;
    }

    // 8. Khung Ảnh Polaroid 3D 📷 (Nếu có ảnh kỷ niệm)
    function createPolaroidPhoto(url, startX, startY, startZ, speed) {
      const group = new THREE.Group();
      const frameGeo = new THREE.BoxGeometry(2.4, 3.0, 0.08);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      group.add(frame);

      const loader = new THREE.TextureLoader();
      loader.load(url, (tex) => {
        const photoGeo = new THREE.PlaneGeometry(2.1, 2.1);
        const photoMat = new THREE.MeshBasicMaterial({ map: tex });
        const photo = new THREE.Mesh(photoGeo, photoMat);
        photo.position.set(0, 0.3, 0.05);
        group.add(photo);
      });

      group.position.set(startX, startY, startZ);
      scene.add(group);

      const item = {
        mesh: group, baseSpeed: speed,
        rotSpeedX: (Math.random() - 0.5) * 0.02, rotSpeedY: 0.02, rotSpeedZ: (Math.random() - 0.5) * 0.02,
        initialY: 34, resetY: -32, type: 'polaroid'
      };
      fallingItems.push(item);
      return item;
    }

    /* =========================================================================
       6. KHỞI TẠO CƠN MƯA LỜI CHÚC & QUÀ CÁP DÀY ĐẶC
       ========================================================================= */
    let nextWishIndex = 0;
    function getNextWish() {
      const wish = ALL_WISHES[nextWishIndex % ALL_WISHES.length];
      nextWishIndex++;
      return wish;
    }

    function initThickWaterfall() {
      const isMobile = window.innerWidth < 600;
      const spreadX = isMobile ? 12 : 24;
      const spreadZ = isMobile ? 12 : 20;

      // 1. Thả 40 thẻ lời chúc
      const wishCount = 40;
      for (let i = 0; i < wishCount; i++) {
        const wish = getNextWish();
        const x = (Math.random() - 0.5) * spreadX;
        const y = -28 + (i / wishCount) * 62;
        const z = (Math.random() - 0.5) * spreadZ;
        const speed = 0.06 + Math.random() * 0.06;
        createPillSprite(wish, x, y, z, speed);
      }

      // 2. Thả 28 vật thể quà cáp đa dạng rơi xen kẽ
      const giftCount = 28;
      for (let j = 0; j < giftCount; j++) {
        const x = (Math.random() - 0.5) * spreadX;
        const y = -26 + (j / giftCount) * 60;
        const z = (Math.random() - 0.5) * spreadZ;
        const speed = 0.05 + Math.random() * 0.05;

        const type = j % 6;
        if (type === 0) createTeddyBear(x, y, z, speed);
        else if (type === 1) createFlowerBouquet(x, y, z, speed);
        else if (type === 2) createCakeMesh(x, y, z, speed);
        else if (type === 3) createGiftMesh(x, y, z, speed);
        else if (type === 4) createHeartMesh(x, y, z, speed);
        else if (type === 5) createBalloonMesh(x, y, z, speed);
      }

      // 3. Thả ảnh kỷ niệm Polaroid (nếu có)
      if (PHOTOS && PHOTOS.length > 0) {
        PHOTOS.forEach((photoUrl, idx) => {
          const x = (Math.random() - 0.5) * spreadX;
          const y = 10 + idx * 8;
          const z = (Math.random() - 0.5) * spreadZ;
          createPolaroidPhoto(photoUrl, x, y, z, 0.05);
        });
      }
    }
    initThickWaterfall();

    /* =========================================================================
       7. CLICK / TOUCH INTERACTION & CONFETTI
       ========================================================================= */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function triggerConfettiAt(x, y) {
      confetti({
        particleCount: 30,
        spread: 60,
        origin: { x: x / window.innerWidth, y: y / window.innerHeight }
      });
    }

    function onPointerDown(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = fallingItems.map(item => item.mesh);
      const intersects = raycaster.intersectObjects(meshes, true);

      if (intersects.length > 0) {
        let hitObj = intersects[0].object;
        while (hitObj.parent && hitObj.parent !== scene) {
          hitObj = hitObj.parent;
        }

        const found = fallingItems.find(item => item.mesh === hitObj);
        if (found) {
          found.mesh.position.y += 3.0;
          if (found.rotSpeedY !== undefined) found.rotSpeedY += 0.2;
          playPopSound();
          triggerConfettiAt(clientX, clientY);
        }
      }
    }
    window.addEventListener('pointerdown', onPointerDown);

    window.addEventListener('load', () => {
      tryPlayMusic();
      confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
    });

    /* =========================================================================
       8. ANIMATION LOOP & RESIZE
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const isMobile = window.innerWidth < 600;
      const spreadX = isMobile ? 12 : 24;
      const spreadZ = isMobile ? 12 : 20;

      for (let i = 0; i < fallingItems.length; i++) {
        const item = fallingItems[i];
        item.mesh.position.y -= item.baseSpeed;

        if (item.rotSpeedX !== undefined) {
          item.mesh.rotation.x += item.rotSpeedX;
          item.mesh.rotation.y += item.rotSpeedY;
          item.mesh.rotation.z += item.rotSpeedZ;
          if (Math.abs(item.rotSpeedY) > 0.04) item.rotSpeedY *= 0.98;
        }

        if (item.mesh.position.y < item.resetY) {
          item.mesh.position.y = item.initialY + Math.random() * 6;
          item.mesh.position.x = (Math.random() - 0.5) * spreadX;
          item.mesh.position.z = (Math.random() - 0.5) * spreadZ;

          if (item.type === 'pill') {
            const nextWish = getNextWish();
            item.wish = nextWish;
            const newTex = getPillTexture(nextWish);
            item.mesh.material.map = newTex;
            item.mesh.material.needsUpdate = true;
          }
        }
      }

      particles.rotation.y += 0.0008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
